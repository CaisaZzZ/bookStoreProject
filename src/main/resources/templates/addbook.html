<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book</title>
</head>
<body>
    <h1>Add Book</h1>
    <form action="#" th:action="@{/savebook}" th:object="${book}" method="post">
    <p>Author: <input type ="text" th:field="${book.author}" /></p>
    <p>Title: <input type ="text" th:field="${book.title}" /></p>
    <p>ISBN: <input type ="text" th:field="${book.isbn}" /></p>
    <p>Publication Year: <input type ="text" th:field="${book.publicationYear}" /></p>
    <p>Price: <input type="text" th:field="${book.price}"/></p>

    <input type="submit" value="Submit" /> <input type="reset" value="Reset" />
    </form>

</body>
</html>
